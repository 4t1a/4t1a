<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 308" width="1000" height="308" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">4t1a: lossless log compaction and an exact count of what messages mean</title>
  <desc id="d">A ledger page. Events written to the log equal events recovered after compaction, the difference is zero, and the page is stamped reconciled.</desc>
  <defs>
    <filter id="ink" x="-5%" y="-20%" width="110%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="4" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="1.8"/>
    </filter>
  </defs>

  <!-- paper -->
  <rect width="1000" height="308" rx="6" fill="#e9ecdf"/>
  <path d="M0 56H1000M0 84H1000M0 112H1000M0 140H1000M0 168H1000M0 196H1000M0 224H1000M0 252H1000M0 280H1000" stroke="#a9bba9" stroke-width="1"/>
  <path d="M64 0V308M68 0V308" stroke="#c4605a" stroke-opacity="0.55" stroke-width="1"/>
  <path d="M820 64V236" stroke="#a9bba9" stroke-width="1"/>

  <!-- left: identity -->
  <text x="96" y="168" font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif" font-size="96" font-weight="700" letter-spacing="-2" fill="#1d2a3a">4t1a</text>
  <text x="98" y="196" font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif" font-size="22" font-style="italic" fill="#4d5a66">Moustafa Mahmoud Atta</text>
  <text x="98" y="224" font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif" font-size="18" fill="#1d2a3a">Lossless log compaction,</text>
  <text x="98" y="252" font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif" font-size="18" fill="#1d2a3a">and an exact count of what messages mean.</text>

  <!-- right: the ledger -->
  <g font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif" fill="#1d2a3a">
    <text x="580" y="84" font-size="14" font-style="italic" fill="#6a7580">Particulars</text>
    <text x="928" y="84" font-size="14" font-style="italic" fill="#6a7580" text-anchor="end">Events</text>
    <text x="580" y="140" font-size="16">Written to the log</text>
    <text x="580" y="168" font-size="16">Recovered after compaction</text>
    <text x="580" y="224" font-size="16" font-weight="700">Difference</text>
  </g>
  <g font-family="'SFMono-Regular',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="16" fill="#1d2a3a" text-anchor="end">
    <text x="928" y="140">1,000,000</text>
    <text x="928" y="168">1,000,000</text>
    <text x="928" y="224" font-weight="700">0</text>
  </g>
  <path d="M880 229H930M880 232H930" stroke="#1d2a3a" stroke-width="1"/>

  <!-- the one moment: stamp lands once -->
  <g transform="translate(770 270) rotate(-7)">
    <g opacity="0.9" filter="url(#ink)">
      <animate attributeName="opacity" values="0;0;0.9" keyTimes="0;0.89;1" dur="1.1s" fill="freeze"/>
      <animateTransform attributeName="transform" type="scale" values="1.7;1.7;1" keyTimes="0;0.89;1" dur="1.1s" fill="freeze"/>
      <rect x="-100" y="-21" width="200" height="42" rx="4" fill="none" stroke="#b3261e" stroke-width="3"/>
      <rect x="-94" y="-15" width="188" height="30" rx="2" fill="none" stroke="#b3261e" stroke-width="1"/>
      <text x="0" y="7" text-anchor="middle" font-family="'Helvetica Neue',Arial,sans-serif" font-size="21" font-weight="700" letter-spacing="4" fill="#b3261e">RECONCILED</text>
    </g>
  </g>
</svg>
